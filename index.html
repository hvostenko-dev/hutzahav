<!doctype html>
<html lang="he" dir="rtl" class="scroll-smooth bg-[#08080A]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Page-specific title, description, canonical, hreflang, Open Graph and JSON-LD
         are injected per route at build time by scripts/prerender.mjs -->
    <!--app-head-->
    <meta name="author" content="Galina Khvostenko, HUTZAHAV Atelier" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Geotargeting Meta Tags (Local Israeli Search Optimization) -->
    <meta name="geo.region" content="IL-D" />
    <meta name="geo.placename" content="Ashdod, Israel" />
    <meta name="geo.position" content="31.801444;34.643491" />
    <meta name="ICBM" content="31.801444, 34.643491" />

    <!-- Theme & Mobile App Capability -->
    <meta name="theme-color" content="#08080A" />
    <meta name="msapplication-navbutton-color" content="#08080A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HUTZAHAV" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/jpeg" href="/images/logo.jpg" />
    <link rel="apple-touch-icon" href="/images/logo.jpg" />

    <!-- Google Luxury Fonts (Preconnected) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </head>
  <body class="bg-[#08080A] text-[#E8E6DF] antialiased selection:bg-[#D5B46D] selection:text-black overflow-x-hidden">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
